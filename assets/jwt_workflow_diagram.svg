<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" height="100%">
  <defs>
    <linearGradient id="jwtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d19" />
      <stop offset="100%" stop-color="#191333" />
    </linearGradient>
    <linearGradient id="jwtHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="jShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <marker id="jArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="jArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <rect width="1080" height="560" rx="14" fill="url(#jwtBg)" stroke="#272744" stroke-width="2" />

  <!-- Header -->
  <rect x="30" y="20" width="1020" height="42" rx="8" fill="url(#jwtHeader)" />
  <text x="50" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff">🔐 MÃ HÓA TOKEN VỚI JSON WEB TOKEN (JWT) &amp; XÁC THỰC STATELESS</text>
  <text x="800" y="47" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fdf2f8">RFC 7519 • HMAC-SHA512</text>

  <!-- Top: 3 Parts of JWT Token -->
  <g transform="translate(30, 75)" filter="url(#jShadow)">
    <rect width="1020" height="110" rx="10" fill="#131c31" stroke="#253556" stroke-width="1.5" />
    <text x="20" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#c084fc">Structure 3 Phần Của JWT: Header . Payload . Signature</text>

    <!-- Part 1: Header -->
    <rect x="20" y="38" width="310" height="60" rx="6" fill="#1e1b4b" stroke="#f43f5e" stroke-width="1.5" />
    <text x="35" y="58" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fb7185">1. HEADER (Đỏ)</text>
    <text x="35" y="78" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#cbd5e1">{ "alg": "HS512", "typ": "JWT" }</text>
    <text x="35" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#94a3b8">Base64Url Encoded</text>

    <!-- Dot 1 -->
    <text x="345" y="75" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="900" fill="#ffffff">.</text>

    <!-- Part 2: Payload -->
    <rect x="370" y="38" width="310" height="60" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" />
    <text x="385" y="58" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#c084fc">2. PAYLOAD (Tím)</text>
    <text x="385" y="78" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">{ "sub": "admin", "exp": 1720000000, "role": "ADMIN" }</text>
    <text x="385" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#94a3b8">Chứa Claims thông tin người dùng</text>

    <!-- Dot 2 -->
    <text x="695" y="75" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="900" fill="#ffffff">.</text>

    <!-- Part 3: Signature -->
    <rect x="720" y="38" width="280" height="60" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="735" y="58" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#34d399">3. SIGNATURE (Xanh)</text>
    <text x="735" y="78" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">HMACSHA512(header + payload, secret)</text>
    <text x="735" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#a7f3d0">Chữ ký chống giả mạo dữ liệu</text>
  </g>

  <!-- Bottom Left: Flow 1 - Login & Generate Token -->
  <g transform="translate(30, 200)" filter="url(#jShadow)">
    <rect width="495" height="340" rx="10" fill="#131c31" stroke="#253556" stroke-width="1.5" />
    <rect width="495" height="34" rx="10" fill="#1e293b" />
    <text x="20" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Giai Đoạn 1: Đăng Nhập &amp; Cấp Phát JWT Token</text>

    <rect x="15" y="48" width="465" height="60" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="25" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Bước 1: Client gửi credentials lên Backend</text>
    <text x="25" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">POST /api/v1/auth/login { "username": "admin", "password": "123" }</text>

    <path d="M 245 110 L 245 125" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#jArrow)" />

    <rect x="15" y="130" width="465" height="85" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="25" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Bước 2: Backend xác thực &amp; mã hóa Token</text>
    <text x="25" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#cbd5e1">• PasswordEncoder.matches(rawPassword, encodedPassword)</text>
    <text x="25" y="192" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a78bfa">• String token = jwtProvider.generateToken(username);</text>
    <text x="25" y="208" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#94a3b8">  (Set Subject, Expiration Date, Ký bằng SECRET KEY)</text>

    <path d="M 245 220 L 245 235" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#jArrowGreen)" />

    <rect x="15" y="240" width="465" height="80" rx="6" fill="#064e3b" stroke="#10b981" />
    <text x="25" y="262" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#34d399">Bước 3: Trả về Client lưu trữ (200 OK)</text>
    <text x="25" y="282" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ecfdf5">{ "status": 200, "message": "Login OK", "token": "eyJhbGci..." }</text>
    <text x="25" y="302" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#a7f3d0">Client lưu vào localStorage hoặc cookie để gửi kèm các request sau.</text>
  </g>

  <!-- Bottom Right: Flow 2 - Filter Validation & Context Set -->
  <g transform="translate(550, 200)" filter="url(#jShadow)">
    <rect width="500" height="340" rx="10" fill="#131c31" stroke="#253556" stroke-width="1.5" />
    <rect width="500" height="34" rx="10" fill="#1e293b" />
    <text x="20" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#34d399">Giai Đoạn 2: JWTFilterChain Đánh Chặn &amp; Xác Thực</text>

    <rect x="15" y="48" width="470" height="60" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="25" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Bước 1: Client đính kèm Bearer Token vào Request Header</text>
    <text x="25" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">Authorization: Bearer eyJhbGciOiJIUzUxMiJ9...</text>

    <path d="M 250 110 L 250 125" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#jArrow)" />

    <rect x="15" y="130" width="470" height="95" rx="6" fill="#1e1b4b" stroke="#818cf8" />
    <text x="25" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">Bước 2: JWTFilterChain (OncePerRequestFilter) xử lý</text>
    <text x="25" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#cbd5e1">1. Lấy token: <tspan font-family="'JetBrains Mono', monospace" fill="#38bdf8">request.getHeader("Authorization").substring(7)</tspan></text>
    <text x="25" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#cbd5e1">2. Kiểm tra tính toàn vẹn: <tspan font-family="'JetBrains Mono', monospace" fill="#34d399">jwtProvider.validateToken(token)</tspan></text>
    <text x="25" y="208" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#cbd5e1">3. Giải mã username: <tspan font-family="'JetBrains Mono', monospace" fill="#fbbf24">jwtProvider.getUsernameFromToken(token)</tspan></text>

    <path d="M 250 230 L 250 245" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#jArrowGreen)" />

    <rect x="15" y="250" width="470" height="75" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
    <text x="25" y="272" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#34d399">Bước 3: Nạp UserDetails vào SecurityContextHolder</text>
    <text x="25" y="292" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">UsernamePasswordAuthenticationToken auth = new ...(userDetails, ...);</text>
    <text x="25" y="308" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">SecurityContextHolder.getContext().setAuthentication(auth);</text>
  </g>
</svg>
