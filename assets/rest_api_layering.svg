<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 540" width="100%" height="100%">
  <defs>
    <linearGradient id="restBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <marker id="mArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="1050" height="540" rx="14" fill="url(#restBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="30" y="20" width="990" height="42" rx="8" fill="url(#headerGrad)" />
  <text x="50" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff">⚡ RESTful API ARCHITECTURE &amp; ENDPOINT CONVENTIONS</text>
  <text x="730" y="47" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#e0f2fe">Standard: Stateless • JSON • REST Verbs</text>

  <!-- Left: REST URI & Method Mapping Matrix -->
  <g transform="translate(30, 80)" filter="url(#cardShadow)">
    <rect width="480" height="430" rx="10" fill="#131c31" stroke="#253556" stroke-width="1.5" />
    <rect width="480" height="34" rx="10" fill="#1e293b" />
    <text x="20" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">📋 Quy Tắc Đặt Tên Endpoint &amp; Phương Thức Chuẩn REST</text>

    <!-- Table header -->
    <rect x="15" y="45" width="450" height="28" rx="4" fill="#0f172a" />
    <text x="25" y="64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8">METHOD</text>
    <text x="105" y="64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8">ENDPOINT PATTERN</text>
    <text x="290" y="64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8">STATUS &amp; ACTION</text>

    <!-- Row 1: GET All -->
    <rect x="15" y="80" width="70" height="24" rx="4" fill="#0369a1" />
    <text x="50" y="96" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">GET</text>
    <text x="105" y="96" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">/api/v1/products</text>
    <text x="290" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#34d399">200 OK • Lấy danh sách</text>

    <!-- Row 2: GET By ID -->
    <rect x="15" y="115" width="70" height="24" rx="4" fill="#0369a1" />
    <text x="50" y="131" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">GET</text>
    <text x="105" y="131" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">/api/v1/products/{id}</text>
    <text x="290" y="131" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#34d399">200 OK • Chi tiết theo ID</text>

    <!-- Row 3: POST Create -->
    <rect x="15" y="150" width="70" height="24" rx="4" fill="#15803d" />
    <text x="50" y="166" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">POST</text>
    <text x="105" y="166" font-family="'JetBrains Mono', monospace" font-size="12" fill="#4ade80">/api/v1/products</text>
    <text x="290" y="166" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#4ade80">201 Created • Thêm mới</text>

    <!-- Row 4: PUT Update -->
    <rect x="15" y="185" width="70" height="24" rx="4" fill="#d97706" />
    <text x="50" y="201" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">PUT</text>
    <text x="105" y="201" font-family="'JetBrains Mono', monospace" font-size="12" fill="#fbbf24">/api/v1/products/{id}</text>
    <text x="290" y="201" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#fbbf24">200 OK • Cập nhật toàn bộ</text>

    <!-- Row 5: DELETE -->
    <rect x="15" y="220" width="70" height="24" rx="4" fill="#be123c" />
    <text x="50" y="236" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">DELETE</text>
    <text x="105" y="236" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f87171">/api/v1/products/{id}</text>
    <text x="290" y="236" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#f87171">204 No Content • Xóa</text>

    <line x1="20" y1="260" x2="460" y2="260" stroke="#334155" stroke-dasharray="4,4" />

    <!-- Best Practice Rules -->
    <text x="20" y="285" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#fbbf24">💡 4 NGUYÊN TẮC VÀNG THI CỬ:</text>
    <text x="20" y="310" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">1. Dùng <tspan font-weight="700" fill="#38bdf8">Danh từ số nhiều</tspan> cho tài nguyên (e.g. /products, không dùng /getProduct).</text>
    <text x="20" y="332" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">2. <tspan font-weight="700" fill="#f87171">Không chứa động từ</tspan> trong URI (Hành động thể hiện qua HTTP Verb).</text>
    <text x="20" y="354" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">3. Phân cấp cha - con rõ ràng: <tspan font-family="'JetBrains Mono', monospace" fill="#38bdf8">/categories/{cid}/products</tspan></text>
    <text x="20" y="376" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">4. Có tiền tố phiên bản API: <tspan font-family="'JetBrains Mono', monospace" fill="#38bdf8">/api/v1/...</tspan> để nâng cấp không làm gãy app cũ.</text>
    <text x="20" y="405" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">SOAP vs REST: REST nhẹ, hỗ trợ JSON, hiệu năng cao hơn XML-SOAP.</text>
  </g>

  <!-- Right: Spring Parameter Binding & Annotation Comparison -->
  <g transform="translate(540, 80)" filter="url(#cardShadow)">
    <rect width="480" height="430" rx="10" fill="#131c31" stroke="#253556" stroke-width="1.5" />
    <rect width="480" height="34" rx="10" fill="#1e293b" />
    <text x="20" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#c084fc">🔍 So Sánh Cơ Chế Nhận Tham Số Trong Controller</text>

    <!-- Box 1: PathVariable vs RequestParam -->
    <rect x="15" y="48" width="450" height="110" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="25" y="70" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">@PathVariable vs @RequestParam</text>
    <text x="25" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">• <tspan font-weight="700" fill="#38bdf8">@PathVariable:</tspan> Lấy giá trị trực tiếp từ URI đường dẫn: <tspan font-family="'JetBrains Mono', monospace" fill="#38bdf8">/products/{id}</tspan></text>
    <text x="25" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">• <tspan font-weight="700" fill="#fb923c">@RequestParam:</tspan> Lấy từ Query String sau dấu ?: <tspan font-family="'JetBrains Mono', monospace" fill="#fb923c">?page=1&amp;limit=10&amp;sort=asc</tspan></text>
    <text x="25" y="135" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">@GetMapping("/search") public Page&lt;T&gt; search(@RequestParam String keyword)</text>

    <!-- Box 2: RequestBody vs ModelAttribute -->
    <rect x="15" y="170" width="450" height="115" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="25" y="192" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#34d399">@RequestBody vs @ModelAttribute</text>
    <text x="25" y="214" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">• <tspan font-weight="700" fill="#34d399">@RequestBody:</tspan> Đọc raw payload từ HTTP Body (Content-Type: <tspan font-family="'JetBrains Mono', monospace" fill="#34d399">application/json</tspan>)</text>
    <text x="25" y="234" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">• <tspan font-weight="700" fill="#f472b6">@ModelAttribute:</tspan> Đọc dữ liệu từ form-urlencoded hoặc multipart form upload.</text>
    <text x="25" y="258" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">@PostMapping public Res create(@RequestBody @Valid ProductDTO dto)</text>

    <!-- Box 3: 4 Core Stereotypes -->
    <rect x="15" y="295" width="450" height="120" rx="8" fill="#1e1b4b" stroke="#6366f1" />
    <text x="25" y="318" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#a5b4fc">🏛️ Phân Tầng Annotation Chuẩn 3-Tier:</text>
    <text x="25" y="340" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• <tspan font-weight="700" fill="#2dd4bf">@RestController</tspan> = @Controller + @ResponseBody (tự serialize POJO sang JSON)</text>
    <text x="25" y="362" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• <tspan font-weight="700" fill="#818cf8">@Service</tspan> = Chứa Transaction, Business Logic, tính toán xử lý dữ liệu</text>
    <text x="25" y="384" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• <tspan font-weight="700" fill="#c084fc">@Repository</tspan> = Thao tác truy vấn Database, dịch SQLException sang DataAccessException</text>
    <text x="25" y="404" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">• @Component là annotation gốc của cả 3 annotation chuyên biệt trên.</text>
  </g>
</svg>
