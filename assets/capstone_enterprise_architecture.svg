<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%">
  <defs>
    <linearGradient id="capBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a1a" />
      <stop offset="100%" stop-color="#18132b" />
    </linearGradient>
    <linearGradient id="capHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="cShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <marker id="cArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="1100" height="560" rx="14" fill="url(#capBg)" stroke="#312e81" stroke-width="2" />

  <!-- Header -->
  <rect x="30" y="20" width="1040" height="42" rx="8" fill="url(#capHeader)" />
  <text x="50" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff">🏆 MEGA CAPSTONE ENTERPRISE ARCHITECTURE: FULL-STACK SPRING BOOT 3 REST SERVICES</text>
  <text x="820" y="47" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fdf2f8">End-to-End Enterprise System</text>

  <!-- Left: Client & Security Gateway -->
  <g transform="translate(30, 80)" filter="url(#cShadow)">
    <rect width="230" height="440" rx="10" fill="#131b2e" stroke="#253556" stroke-width="1.5" />
    <rect width="230" height="34" rx="10" fill="#1e293b" />
    <text x="20" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">1. Client &amp; Gateway</text>

    <rect x="15" y="50" width="200" height="85" rx="6" fill="#0f172a" stroke="#38bdf8" />
    <text x="25" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Client Requests</text>
    <text x="25" y="92" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">• Postman / React App</text>
    <text x="25" y="110" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fbbf24">• Headers: Bearer JWT</text>
    <text x="25" y="126" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#34d399">• Content: JSON / Form</text>

    <!-- Arrow down -->
    <path d="M 115 140 L 115 158" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#cArrow)" />

    <rect x="15" y="165" width="200" height="135" rx="6" fill="#1e1b4b" stroke="#818cf8" />
    <text x="25" y="188" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#a5b4fc">Security Filter Chain</text>
    <text x="25" y="210" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">1. CorsFilter (All origins)</text>
    <text x="25" y="228" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">2. Csrf (Disabled)</text>
    <text x="25" y="248" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399">3. JWTFilterChain</text>
    <text x="25" y="268" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fb7185">4. JWTEntryPoint (401)</text>
    <text x="25" y="288" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">5. Authz: ADMIN/USER</text>

    <!-- Arrow down -->
    <path d="M 115 305 L 115 325" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#cArrow)" />

    <rect x="15" y="330" width="200" height="90" rx="6" fill="#0f172a" stroke="#f43f5e" />
    <text x="25" y="352" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#fda4af">@RestControllerAdvice</text>
    <text x="25" y="372" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">• CustomException (404)</text>
    <text x="25" y="390" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">• ValidationExcep (400)</text>
    <text x="25" y="408" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">• MaxUploadExceeded (400)</text>
  </g>

  <!-- Middle: Controllers & Services -->
  <g transform="translate(290, 80)" filter="url(#cShadow)">
    <rect width="480" height="440" rx="10" fill="#131b2e" stroke="#253556" stroke-width="1.5" />
    <rect width="480" height="34" rx="10" fill="#1e293b" />
    <text x="20" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#34d399">2. REST Controllers &amp; Business Services (IoC Container)</text>

    <!-- Controllers Grid -->
    <rect x="15" y="50" width="215" height="160" rx="8" fill="#0f172a" stroke="#0d9488" />
    <text x="25" y="73" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#2dd4bf">AuthController</text>
    <text x="25" y="93" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">• POST /auth/login</text>
    <text x="25" y="110" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">• POST /auth/register</text>
    <text x="25" y="128" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">DTO: UserLoginDTO</text>
    <text x="25" y="146" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">DTO: UserRegisterDTO</text>
    <text x="25" y="166" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">@Valid + @UsernameUnique</text>
    <text x="25" y="185" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399">Returns: DataResponse&lt;T&gt;</text>

    <rect x="250" y="50" width="215" height="160" rx="8" fill="#0f172a" stroke="#0d9488" />
    <text x="260" y="73" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#2dd4bf">ProductController</text>
    <text x="260" y="93" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">• GET /products (Page)</text>
    <text x="260" y="110" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">• GET /products/{id}</text>
    <text x="260" y="128" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">• POST /products (File)</text>
    <text x="260" y="146" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">• PUT /products/{id}</text>
    <text x="260" y="164" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">• DELETE /products/{id}</text>
    <text x="260" y="185" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">Paging, Sort &amp; Filter</text>

    <!-- Services Grid -->
    <rect x="15" y="225" width="450" height="195" rx="8" fill="#1e1b4b" stroke="#6366f1" />
    <text x="25" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#c084fc">Tầng Dịch Vụ Nghiệp Vụ (@Service Layer):</text>

    <text x="25" y="273" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#a5b4fc">• UserService: <tspan font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#cbd5e1">Xử lý login, hash password bằng BCrypt, phân quyền Roles.</tspan></text>
    <text x="25" y="295" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#a5b4fc">• ProductService: <tspan font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#cbd5e1">CRUD, search keyword, filter category, phân trang PageRequest.</tspan></text>
    <text x="25" y="318" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#a5b4fc">• CloudinaryService: <tspan font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#cbd5e1">Upload MultipartFile lên Cloudinary CDN và trả về link ảnh.</tspan></text>
    <text x="25" y="340" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#a5b4fc">• CustomUserDetailService: <tspan font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#cbd5e1">Tải user từ DB chuyển thành UserPrincipal.</tspan></text>
    <text x="25" y="365" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#fbbf24">• JWTProvider: <tspan font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#cbd5e1">Ký token HS512, giải mã username và validate expiration.</tspan></text>
    <text x="25" y="395" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#34d399">Tất cả Bean liên kết lỏng lẻo (Loose Coupling) qua Dependency Injection (@Autowired).</text>
  </g>

  <!-- Right: Spring Data JPA & MySQL -->
  <g transform="translate(800, 80)" filter="url(#cShadow)">
    <rect width="270" height="440" rx="10" fill="#131b2e" stroke="#253556" stroke-width="1.5" />
    <rect width="270" height="34" rx="10" fill="#1e293b" />
    <text x="20" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f472b6">3. Data &amp; Database</text>

    <!-- JPA Repositories -->
    <rect x="15" y="50" width="240" height="150" rx="6" fill="#0f172a" stroke="#8b5cf6" />
    <text x="25" y="72" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c084fc">Spring Data JPA Repos</text>
    <text x="25" y="93" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">• ProductRepository</text>
    <text x="35" y="110" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">findByCategory(cid, page)</text>
    <text x="35" y="126" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">@Query JPQL Search</text>
    <text x="25" y="146" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">• UserRepository</text>
    <text x="35" y="163" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">findByUsername(username)</text>
    <text x="25" y="183" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">• CategoryRepository</text>

    <!-- Arrow down -->
    <path d="M 135 205 L 135 225" fill="none" stroke="#ec4899" stroke-width="2" marker-end="url(#cArrow)" />

    <!-- MySQL DB -->
    <rect x="15" y="230" width="240" height="190" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1.8" />
    <text x="25" y="253" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ec4899">🐬 MySQL 8.0 Engine</text>
    <text x="25" y="275" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">• tbl_categories (1)</text>
    <text x="35" y="292" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#34d399">  &lt;--- @OneToMany ---</text>
    <text x="25" y="310" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">• tbl_products (N)</text>
    <text x="35" y="327" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">  --- @ManyToOne (FK) ---&gt;</text>
    <text x="25" y="348" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">• tbl_users &lt;--&gt; tbl_roles</text>
    <text x="35" y="365" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#fbbf24">  @ManyToMany (@JoinTable)</text>
    <text x="25" y="392" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#34d399">HikariCP Connection Pool</text>
    <text x="25" y="410" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">ddl-auto: update • Hibernate 6</text>
  </g>
</svg>
